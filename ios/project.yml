name: VVDemus
options:
  bundleIdPrefix: com.nv7.vvdemus
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  # A vendored fork, not the upstream release. Swifter 1.5.0 has defects that can only be
  # fixed inside the library (an accept() loop that dies for good on any transient error,
  # a racy stop(), a double close(2) that can destroy an unrelated descriptor). The source
  # lives in VVDemus/Vendor/Swifter with a README recording what was changed and why.
  Swifter:
    path: VVDemus/Vendor/Swifter
targets:
  VVDemus:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: VVDemus
        excludes:
          - "Info.plist"
          # Built as a package (above), so its sources must not also be compiled straight
          # into the app — that would be two copies of every Swifter type.
          - "Vendor/**"
    dependencies:
      - package: Swifter
    info:
      path: Generated/Info.plist
      properties:
        # Referenced rather than hardcoded: XcodeGen writes this plist from scratch, so a
        # literal here silently ignores MARKETING_VERSION/CURRENT_PROJECT_VERSION and the
        # version shown in the app never changes no matter what the settings say.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Spotify
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nv7.vvdemus.app
        # Kept here rather than only in the Xcode UI. Set through Xcode it lives solely in
        # project.pbxproj, which XcodeGen rewrites from scratch on every `xcodegen
        # generate` — so the signing team silently vanished each time the project was
        # regenerated, and the next device build failed with "requires a development team".
        DEVELOPMENT_TEAM: FTVNWWU5J2
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
  VVDemusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: VVDemusTests
    dependencies:
      - target: VVDemus
      # So SwifterHardeningTests can `import Swifter` and exercise the vendored fork's
      # primitives directly rather than only through the app.
      - package: Swifter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nv7.vvdemus.app.tests
        DEVELOPMENT_TEAM: FTVNWWU5J2
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VVDemus.app/VVDemus"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  VVDemus:
    build:
      targets:
        VVDemus: all
        VVDemusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: VVDemusTests
          # The benchmarks hit the real network and cost real cellular data, so they stay
          # out of the everyday suite. The VVDemus-Benchmarks scheme runs them.
          skippedTests:
            - DataUsageBenchmarks
            - StreamFormatDiagnostics
            - PlayerClientProbe
            - PlaybackSmokeTest
            - StreamUrlRangeTests
            - ResourceLoaderUrlIntegrityTests
            # Downloads a real track from YouTube. Same reasoning as the rest of this list:
            # real bytes, real dependency on YouTube being up.
            - DownloadIntegrationTests
    archive:
      config: Release
  # Measures real bytes over the wire — run deliberately, not on every build.
  VVDemus-Benchmarks:
    build:
      targets:
        VVDemus: all
        VVDemusTests: [test]
    test:
      config: Debug
      targets:
        - name: VVDemusTests
          skippedTests:
            - AirPodsRouteTests
            - BackgroundPlaybackTests
            - DeviceSwitchingTests
            - HarnessSmokeTests
            - InterruptionTests
            - LocalControlServerTests
            - NowPlayingInfoTests
            - PersistenceAndParsingTests
            - DurationReconciliationTests
            - QueueAndTransportTests
            - RateLimitTests
            - RemoteCommandTests
            - SystemMediaWiringTests
