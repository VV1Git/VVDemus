name: VVDemus
options:
  bundleIdPrefix: com.vvdemus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  Swifter:
    url: https://github.com/httpswift/swifter.git
    from: 1.5.0
targets:
  VVDemus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VVDemus
        excludes:
          - "Info.plist"
    dependencies:
      - package: Swifter
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Music
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vvdemus.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
schemes:
  VVDemus:
    build:
      targets:
        VVDemus: all
    run:
      config: Debug
    archive:
      config: Release
