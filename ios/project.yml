name: VVDemus
options:
  # Unused in practice — both targets set PRODUCT_BUNDLE_IDENTIFIER explicitly — but it is
  # XcodeGen-time text, so it cannot reference the build setting the real prefix lives in.
  # Left neutral rather than carrying a real one for no reason.
  bundleIdPrefix: com.example.vvdemus
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
# Deliberately no `SYMROOT` override here. Redirecting build products into a `.noindex`
# directory would keep the iOS build out of Spotlight, but setting SYMROOT at all switches
# Xcode to "legacy build locations", which SwiftPM refuses: "Packages are not supported when
# using legacy build locations". The vendored Swifter is a package, so this project cannot
# have both. Keeping the iOS app bundles out of Spotlight has to be done outside the project
# (System Settings › Spotlight › Search Privacy).
# Signing team and bundle id prefix, which are per-machine rather than per-project. See
# Config/Signing.xcconfig: it holds placeholders and optionally includes a gitignored
# Signing.local.xcconfig with the real values, so a commit never carries either.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  # A vendored fork, not the upstream release. Swifter 1.5.0 has defects that can only be
  # fixed inside the library (an accept() loop that dies for good on any transient error,
  # a racy stop(), a double close(2) that can destroy an unrelated descriptor). The source
  # lives in VVDemus/Vendor/Swifter with a README recording what was changed and why.
  Swifter:
    path: VVDemus/Vendor/Swifter
targets:
  VVDemus:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: VVDemus
        excludes:
          - "Info.plist"
          # Built as a package (above), so its sources must not also be compiled straight
          # into the app — that would be two copies of every Swifter type.
          - "Vendor/**"
    dependencies:
      - package: Swifter
    info:
      path: Generated/Info.plist
      properties:
        # Referenced rather than hardcoded: XcodeGen writes this plist from scratch, so a
        # literal here silently ignores MARKETING_VERSION/CURRENT_PROJECT_VERSION and the
        # version shown in the app never changes no matter what the settings say.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Spotify β
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
        # Pairing with the Mac. The app has never needed these: it only ever *listened* for
        # incoming connections, which iOS does not gate. Browsing for a peer does need them,
        # and without the usage string iOS refuses the prompt outright rather than asking.
        NSLocalNetworkUsageDescription: >-
          Spotify β uses your local network to find and stay in sync with the Spotify β app on
          your computer.
        NSBonjourServices:
          - _vvdemus._tcp
        # The backup file's own type, so the import picker can offer backups instead of
        # greying out everything except "all JSON". Exported rather than imported because
        # this app is the one that defines `com.vvdemus.backup`; a file conforming to
        # `public.json` as well means Quick Look and every text editor will still open one.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.vvdemus.backup
            UTTypeDescription: VVDemus Backup
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - vvdem
    settings:
      base:
        # Comes from Config/Signing.xcconfig, so the id this build answers to is a local
        # fact and not something a commit reassigns — see the long note there about why the
        # bundle id is the one setting that must never change behind your back.
        # DEVELOPMENT_TEAM comes from that same file and is deliberately absent here:
        # naming it at target level would both put it back in the diff and let it override
        # the config file.
        PRODUCT_BUNDLE_IDENTIFIER: $(VVDEMUS_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
    preBuildScripts:
      # Installing a device build under the wrong bundle id is the one mistake here that
      # costs real data: iOS keys the app's container to it, so a changed id means a second
      # app with empty defaults and a first app that has become unreachable. It happened —
      # a missing Signing.local.xcconfig let a placeholder id through and produced exactly
      # that, and it read as "the update wiped my history".
      #
      # Simulator builds are deliberately exempt: nothing anyone cares about lives in a
      # simulator container, and a fresh clone has to be able to build and run the suite
      # with no local file at all.
      - name: Verify signing identity
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = "iphoneos" ] || exit 0
          case "$PRODUCT_BUNDLE_IDENTIFIER" in
            *CHANGE-ME*)
              echo "error: ios/Config/Signing.local.xcconfig is missing, so this build fell back to the placeholder bundle id '$PRODUCT_BUNDLE_IDENTIFIER'."
              echo "error: Installing it would create a SECOND app on the phone with empty history rather than updating the real one."
              echo "error: Create ios/Config/Signing.local.xcconfig with the two lines for this machine, e.g.:"
              echo "error:     DEVELOPMENT_TEAM = ABCDE12345"
              echo "error:     VVDEMUS_BUNDLE_ID = com.yourprefix.vvdemus.app"
              echo "error: Use the SAME VVDEMUS_BUNDLE_ID this machine has always used — changing it orphans the app data already on your phone."
              exit 1
              ;;
          esac
  # The Mac half of the two-peer setup. It compiles the *same* sources as the iOS app rather
  # than importing a shared package: everything in this codebase is `internal`, so extracting
  # a module would mean marking several hundred declarations `public` and reworking
  # `@testable import VVDemus` across the test suite, to buy nothing a second target doesn't
  # already give. The cost is compiling the shared files twice.
  #
  # Only two view files are genuinely iOS-shaped, and both are the tab bar: `RootView` is a
  # `TabView` using iOS-26-only API (`tabBarMinimizeBehavior`, `tabViewBottomAccessory`), and
  # `MiniPlayerBar` reads `tabViewBottomAccessoryPlacement` to decide its own layout. The Mac
  # replaces exactly those two, in `MacApp/`, and shares every screen below them.
  VVDemusMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: VVDemus
        excludes:
          - "Info.plist"
          - "Vendor/**"
          # The two tab-bar files. See the note above the target.
          - "Views/RootView.swift"
          - "Views/Components/MiniPlayerBar.swift"
          # iOS-only, and reached only from files already excluded here: the app entry point,
          # memory-warning logging, and the silent-audio trick that keeps a backgrounded phone
          # from being suspended. A Mac app is not suspended out from under its server.
          - "App/VVDemusApp.swift"
          - "App/MemoryDiagnostics.swift"
          - "Player/BackgroundKeepAlive.swift"
          # The catalog's AppIcon is sized for iOS. A Mac icon is its own piece of work;
          # including this unchanged only produces missing-size warnings.
          - "Resources/Assets.xcassets"
          - "Resources/silence.m4a"
      - path: MacApp
    dependencies:
      - package: Swifter
    info:
      path: Generated/Info-Mac.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Both, unlike iOS which needs only the display name: on macOS the menu bar and the
        # About panel read CFBundleName, while Finder reads CFBundleDisplayName. Setting one
        # leaves the app called "VVDemusMac" in the other.
        CFBundleName: Spotify β
        CFBundleDisplayName: Spotify β
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Discovery for the phone↔Mac pairing. Advertising alone would not need this, but
        # browsing does, and macOS will silently find nothing without it.
        NSLocalNetworkUsageDescription: >-
          Spotify β uses your local network to find and stay in sync with the Spotify β app on
          your phone.
        NSBonjourServices:
          - _vvdemus._tcp
        # The backup file's own type, so the import picker can offer backups instead of
        # greying out everything except "all JSON". Exported rather than imported because
        # this app is the one that defines `com.vvdemus.backup`; a file conforming to
        # `public.json` as well means Quick Look and every text editor will still open one.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.vvdemus.backup
            UTTypeDescription: VVDemus Backup
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - vvdem
    settings:
      base:
        # A distinct id from the phone's: these are two apps, installed on two machines, and
        # the Mac has its own container. Derived from the same local value so it moves with
        # whatever prefix this machine signs under.
        PRODUCT_BUNDLE_IDENTIFIER: $(VVDEMUS_BUNDLE_ID).mac
        # The bundle really is called this — `CFBundleName` alone was not enough. macOS names
        # an app in the Dock, in Finder and in Force Quit by its *bundle filename*, so with the
        # product left at the target name the app was "VVDemusMac" everywhere it mattered and
        # "Spotify β" only in the menu bar. The scheme is still VVDemusMac; only the product
        # changes, so `xcodebuild -scheme VVDemusMac` is unaffected.
        PRODUCT_NAME: Spotify β
        # Deliberately not ad-hoc (`CODE_SIGN_IDENTITY = -`). macOS keys the local-network
        # permission to the code signature, and ad-hoc signing produces a new one on every
        # build — which means re-prompting, or a silently dropped grant, after each rebuild.
        # A development certificate keeps one stable identity across builds.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        # The same artwork the phone uses, resized to the sizes macOS asks for — see
        # MacApp/Assets.xcassets. It is a separate catalog from the iOS one only because the
        # icon needs `"idiom": "mac"` entries; the image is identical.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # No entitlements are used (CryptoKit and Network.framework need none), so the app
        # needs no provisioning profile and does not expire the way the free-team iOS build
        # does. The sandbox is off for the same reason it would otherwise have to be
        # configured: this is a personal, locally-signed build, not a distributed one.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  VVDemusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: VVDemusTests
    dependencies:
      - target: VVDemus
      # So SwifterHardeningTests can `import Swifter` and exercise the vendored fork's
      # primitives directly rather than only through the app.
      - package: Swifter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VVDEMUS_BUNDLE_ID).tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VVDemus.app/VVDemus"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Drives the real app through every screen and photographs each one.
  #
  # Separate from `VVDemusTests` because it is a different kind of thing: it needs a booted
  # simulator, it takes tens of seconds, and its output is pictures for a person (or a reviewing
  # agent) to look at rather than assertions. It has its own scheme so it never joins the
  # everyday suite.
  VVDemusUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: VVDemusUITests
    dependencies:
      - target: VVDemus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VVDEMUS_BUNDLE_ID).uitests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VVDemus
schemes:
  VVDemus:
    build:
      targets:
        VVDemus: all
        VVDemusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: VVDemusTests
          # The benchmarks hit the real network and cost real cellular data, so they stay
          # out of the everyday suite. The VVDemus-Benchmarks scheme runs them.
          skippedTests:
            - DataUsageBenchmarks
            - StreamFormatDiagnostics
            - PlayerClientProbe
            - PlaybackSmokeTest
            - StreamUrlRangeTests
            - ResourceLoaderUrlIntegrityTests
            # Measures how many bytes a resolved URL really serves. Network, and only
            # meaningful on a device — see the note in the file.
            - ThrottleCapDiagnostics
            # Downloads a real track from YouTube. Same reasoning as the rest of this list:
            # real bytes, real dependency on YouTube being up.
            - DownloadIntegrationTests
    archive:
      config: Release
  # `xcodebuild test -scheme VVDemus-Screens` — walks the app and attaches a screenshot of every
  # screen. Kept off the `VVDemus` scheme so a normal test run stays fast and headless.
  VVDemus-Screens:
    build:
      targets:
        VVDemus: all
        VVDemusUITests: [test]
    test:
      config: Debug
      targets:
        - name: VVDemusUITests
  VVDemusMac:
    build:
      targets:
        VVDemusMac: all
    run:
      config: Debug
    archive:
      config: Release
  # The Mac app as it is actually used, rather than as it is worked on.
  #
  # `VVDemusMac` runs Debug, which is right while changing the app and wrong for the copy that
  # stays open between sessions: unoptimised, and carrying the seams that Debug exists to
  # provide. `PairingSession.pinnedCode` is the one that matters — a `#if DEBUG` environment
  # variable that pins the six-digit pairing code. It is unreachable over the network either
  # way, but "unreachable" and "not compiled in" are not the same claim, and the long-lived
  # local build should be able to make the second one.
  #
  # Every action is Release, deliberately. A scheme that only archives in Release leaves Run
  # and Profile on Debug, so the build you launch from Xcode is never the build you keep —
  # which is exactly the gap this scheme exists to close.
  VVDemusMac-Release:
    build:
      targets:
        VVDemusMac: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
  # Measures real bytes over the wire — run deliberately, not on every build.
  VVDemus-Benchmarks:
    build:
      targets:
        VVDemus: all
        VVDemusTests: [test]
    test:
      config: Debug
      targets:
        - name: VVDemusTests
          skippedTests:
            - AirPodsRouteTests
            - BackgroundPlaybackTests
            - DeviceSwitchingTests
            - HarnessSmokeTests
            - InterruptionTests
            - LocalControlServerTests
            - NowPlayingInfoTests
            - PersistenceAndParsingTests
            - TasteProfileTests
            - DurationReconciliationTests
            - QueueAndTransportTests
            - RateLimitTests
            - RemoteCommandTests
            - SystemMediaWiringTests
