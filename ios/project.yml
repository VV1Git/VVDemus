name: VVDemus
options:
  bundleIdPrefix: com.vvdemus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  VVDemus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VVDemus
        excludes:
          - "Info.plist"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: VVDemus
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Only loopback/.local addresses are ATS-exempt automatically; a LAN IP like
          # 192.168.x.x (needed to reach the Mac's backend from a real phone) is not,
          # and the backend is plain HTTP. Personal-use LAN-only app, so arbitrary
          # loads is an acceptable tradeoff rather than standing up TLS for it.
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "VVDemus connects to your local backend server to search and stream music."
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vvdemus.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
schemes:
  VVDemus:
    build:
      targets:
        VVDemus: all
    run:
      config: Debug
    archive:
      config: Release
