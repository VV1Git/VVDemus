name: VVDemus
options:
  # Unused in practice — both targets set PRODUCT_BUNDLE_IDENTIFIER explicitly — but it is
  # XcodeGen-time text, so it cannot reference the build setting the real prefix lives in.
  # Left neutral rather than carrying a real one for no reason.
  bundleIdPrefix: com.example.vvdemus
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
# Signing team and bundle id prefix, which are per-machine rather than per-project. See
# Config/Signing.xcconfig: it holds placeholders and optionally includes a gitignored
# Signing.local.xcconfig with the real values, so a commit never carries either.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  # A vendored fork, not the upstream release. Swifter 1.5.0 has defects that can only be
  # fixed inside the library (an accept() loop that dies for good on any transient error,
  # a racy stop(), a double close(2) that can destroy an unrelated descriptor). The source
  # lives in VVDemus/Vendor/Swifter with a README recording what was changed and why.
  Swifter:
    path: VVDemus/Vendor/Swifter
targets:
  VVDemus:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: VVDemus
        excludes:
          - "Info.plist"
          # Built as a package (above), so its sources must not also be compiled straight
          # into the app — that would be two copies of every Swifter type.
          - "Vendor/**"
    dependencies:
      - package: Swifter
    info:
      path: Generated/Info.plist
      properties:
        # Referenced rather than hardcoded: XcodeGen writes this plist from scratch, so a
        # literal here silently ignores MARKETING_VERSION/CURRENT_PROJECT_VERSION and the
        # version shown in the app never changes no matter what the settings say.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Spotify β
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
    settings:
      base:
        # Composed from the prefix in Config/Signing.xcconfig, so the id this build answers
        # to is a local fact and not something a commit reassigns. DEVELOPMENT_TEAM comes
        # from that same file and is deliberately absent here — naming it at target level
        # would both put it back in the diff and let it override the config file.
        PRODUCT_BUNDLE_IDENTIFIER: $(VVDEMUS_BUNDLE_ID_PREFIX).app
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
  VVDemusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: VVDemusTests
    dependencies:
      - target: VVDemus
      # So SwifterHardeningTests can `import Swifter` and exercise the vendored fork's
      # primitives directly rather than only through the app.
      - package: Swifter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VVDEMUS_BUNDLE_ID_PREFIX).app.tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VVDemus.app/VVDemus"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  VVDemus:
    build:
      targets:
        VVDemus: all
        VVDemusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: VVDemusTests
          # The benchmarks hit the real network and cost real cellular data, so they stay
          # out of the everyday suite. The VVDemus-Benchmarks scheme runs them.
          skippedTests:
            - DataUsageBenchmarks
            - StreamFormatDiagnostics
            - PlayerClientProbe
            - PlaybackSmokeTest
            - StreamUrlRangeTests
            - ResourceLoaderUrlIntegrityTests
            # Downloads a real track from YouTube. Same reasoning as the rest of this list:
            # real bytes, real dependency on YouTube being up.
            - DownloadIntegrationTests
    archive:
      config: Release
  # Measures real bytes over the wire — run deliberately, not on every build.
  VVDemus-Benchmarks:
    build:
      targets:
        VVDemus: all
        VVDemusTests: [test]
    test:
      config: Debug
      targets:
        - name: VVDemusTests
          skippedTests:
            - AirPodsRouteTests
            - BackgroundPlaybackTests
            - DeviceSwitchingTests
            - HarnessSmokeTests
            - InterruptionTests
            - LocalControlServerTests
            - NowPlayingInfoTests
            - PersistenceAndParsingTests
            - TasteProfileTests
            - DurationReconciliationTests
            - QueueAndTransportTests
            - RateLimitTests
            - RemoteCommandTests
            - SystemMediaWiringTests
